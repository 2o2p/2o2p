<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>2O2P</title>

<style>
@font-face {
    font-family: 'Minecraft';
    src: url('Minecraft.ttf');
}

body {
    margin: 0;
    background: #000;
    color: red;
    font-family: 'Minecraft', Arial;
    text-align: center;
}

/* ШАПКА — ЧИСТЫЙ КИСЛОТНЫЙ */
header {
    background: #00ff00;
    padding: 10px;
    font-size: 24px;
}

/* ЛОГО */
.logo .blue {
    color: #0000ff;
}

.logo .red {
    color: #ff0000;
}

/* ПАНЕЛЬ — ПРОСТО ПРЯМОУГОЛЬНИК */
.card {
    background: #00ff00;
    border: 2px solid #00ff00;
    padding: 20px;
    margin: 50px auto;
    width: 90%;
    max-width: 400px;
}

/* IP */
.ip-box {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid #00ff00;
    color: #0000ff;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <div class="logo">
        <span class="blue">2O</span><span class="red">2P</span>
    </div>
</header>

<div class="card">
    <h2>2o2p server</h2>
    <p>Анархия без правил. Никаких вайпов. Делай что хочешь.</p>

    <p style="color:#00ff00;">??? Playing Now</p>

    <div class="ip-box" onclick="copyIP()">
        role-nine.gl.joinmc.link
    </div>

    <p>Нажми чтобы скопировать</p>
</div>

<script>
function copyIP() {
    navigator.clipboard.writeText("role-nine.gl.joinmc.link");
}
</script>

</body>
</html>
