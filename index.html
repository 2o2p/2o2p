<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>2O2P Server</title>

<style>
@font-face {
    font-family: 'Minecraft';
    src: url('Minecraft.ttf');
}

body {
    margin: 0;
    background: #0e0e0e;
    font-family: 'Minecraft', Arial;
    text-align: center;
    color: red; /* основной текст */
}

/* ШАПКА */
header {
    background: #1f8f3a; /* норм зеленый, не кислотный */
    padding: 15px;
    font-size: 28px;
    border-bottom: 3px solid #00ff88;
}

/* цвет букв 2O2P */
.logo span.blue {
    color: #0000ff;
}

.logo span.red {
    color: #ff0000;
}

/* ПАНЕЛЬ */
.card {
    background: #145c2a; /* зеленая панель */
    border: 2px solid #00ff88;
    border-radius: 8px;
    padding: 25px;
    margin: 60px auto;
    width: 85%;
    max-width: 420px;
    box-shadow: 0 0 20px rgba(0,255,100,0.2);
}

/* текст внутри */
h1, h2, h3, p {
    color: red;
}

/* Playing now */
.playing {
    color: #00ff88;
}

/* IP блок */
.ip-box {
    margin-top: 15px;
    padding: 12px;
    border: 2px solid #00ff88;
    background: #0f3d1f;
    color: #00ff88;
    cursor: pointer;
    transition: 0.2s;
}

.ip-box:hover {
    background: #166b33;
}
</style>

</head>

<body>

<header>
    <div class="logo">
        <span class="blue">2O</span><span class="red">2P</span>
    </div>
</header>

<div class="card">
    <h2>2o2p server</h2>
    <p>Анархия без правил. Никаких вайпов. Делай что хочешь.</p>

    <h3 class="playing">??? Playing Now</h3>

    <div class="ip-box" onclick="copyIP()">
        role-nine.gl.joinmc.link
    </div>

    <p>Нажми чтобы скопировать</p>
</div>

<script>
function copyIP() {
    navigator.clipboard.writeText("role-nine.gl.joinmc.link");
    alert("IP скопирован!");
}
</script>

</body>
</html>
