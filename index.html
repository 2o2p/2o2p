<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>2o2p Server</title>

<style>
@font-face {
    font-family: 'Minecraft';
    src: url('Minecraft.ttf');
}

body {
    margin: 0;
    background: black;
    font-family: 'Minecraft', Arial;
    text-align: center;
}

/* ШАПКА */
.header {
    background: #00ff00;
    padding: 15px;
    font-size: 24px;
}

/* Цвета текста */
.blue { color: #0000ff; }
.red { color: #ff0000; }

/* ПАНЕЛЬ */
.panel {
    margin: 60px auto;
    width: 300px;
    background: #00cc00; /* кислотный но мягче */
    padding: 20px;
}

/* Текст */
.main-text {
    color: #ff0000;
}

/* IP блок */
.ip-box {
    border: 1px solid black;
    padding: 10px;
    margin-top: 15px;
    background: #00aa00;
    color: black;
    cursor: pointer;
}
</style>

</head>

<body>

<div class="header">
    <span class="blue">2O</span><span class="red">2P</span>
</div>

<div class="panel">

    <h2 class="main-text">2o2p server</h2>

    <p class="main-text">
        Анархия без правил. Никаких вайпов. Делай что хочешь.
    </p>

    <h3 class="main-text">??? Playing Now</h3>

    <div class="ip-box" onclick="copyIP()">
        role-nine.gl.joinmc.link
    </div>

    <p class="main-text">Нажми чтобы скопировать</p>

</div>

<script>
function copyIP() {
    navigator.clipboard.writeText("role-nine.gl.joinmc.link");
    alert("IP скопирован");
}
</script>

</body>
</html>
