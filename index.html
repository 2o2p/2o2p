<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>2o2p</title>

<!-- шрифт как в майне -->
<link href="https://fonts.cdnfonts.com/css/minecraft-4" rel="stylesheet">

<style>
body {
    margin: 0;
    background: #1a1a1a;
    font-family: 'Minecraft', Arial, sans-serif;
    color: white;
    text-align: center;
}

/* верхняя панель */
.header {
    background: #2e7d32; /* зелёный */
    padding: 20px;
    font-size: 32px;
}

/* цвета текста */
.blue { color: #3b82f6; }
.red { color: #ef4444; }

/* карточка */
.card {
    background: #2a2a2a;
    margin: 40px auto;
    padding: 30px;
    width: 90%;
    max-width: 500px;
    border-radius: 10px;
}

/* зелёный акцент */
.green {
    color: #4CAF50;
    font-weight: bold;
}

/* кнопка */
.button {
    margin-top: 20px;
    padding: 15px;
    border: 2px solid #4CAF50;
    color: #4CAF50;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

.button:hover {
    background: #4CAF50;
    color: black;
}

/* описание */
.desc {
    margin: 20px 0;
    color: #ccc;
}
</style>

</head>
<body>

<div class="header">
<span class="blue">2O</span><span class="red">2P</span>
</div>

<div class="card">

<h2 class="green">2o2p server</h2>

<p class="desc">
Анархия без правил. Никаких вайпов. Делай что хочешь.
</p>

<h1><span class="green">???</span> Playing Now</h1>

<div class="button" onclick="copyIP()">
📋 role-nine.gl.joinmc.link
</div>

<p style="color: gray;">Нажми чтобы скопировать</p>

</div>

<script>
function copyIP() {
    navigator.clipboard.writeText("role-nine.gl.joinmc.link");
    alert("IP скопирован!");
}
</script>

</body>
</html>
