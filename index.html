<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>2o2p</title>

<style>

/* подключаем твой шрифт */
@font-face {
    font-family: 'Minecraft';
    src: url('Minecraft.ttf') format('truetype');
}

/* общий стиль */
body {
    margin: 0;
    background: #1a1a1a;
    font-family: 'Minecraft', Arial;
    color: white;
    text-align: center;
}

/* шапка */
.header {
    background: #00FF00;
    padding: 25px;
    font-size: 40px;
}

/* цвета */
.red { color: #FF1A1A; }
.blue { color: #0000FF; }

/* карточка */
.card {
    background: #2a2a2a;
    margin: 40px auto;
    padding: 30px;
    width: 90%;
    max-width: 500px;
    border-radius: 10px;
}

/* текст */
.desc {
    margin: 20px 0;
    color: #ccc;
    font-size: 18px;
}

/* зелёный акцент */
.green {
    color: #4CAF50;
}

/* кнопка */
.button {
    margin-top: 20px;
    padding: 15px;
    border: 2px solid #4CAF50;
    color: #4CAF50;
    cursor: pointer;
    font-size: 18px;
    transition: 0.2s;
}

.button:hover {
    background: #4CAF50;
    color: black;
}

</style>

</head>
<body>

<div class="header">
<span class="red">2O</span><span class="blue">2P</span>
</div>

<div class="card">

<h2 class="green">2o2p server</h2>

<p class="desc">
Анархия без правил. Никаких вайпов. Делай что хочешь.
</p>

<h1><span class="green">???</span> Playing Now</h1>

<div class="button" onclick="copyIP()">
📋 role-nine.gl.joinmc.link
</div>

<p style="color: gray;">Нажми чтобы скопировать</p>

</div>

<script>
function copyIP() {
    navigator.clipboard.writeText("role-nine.gl.joinmc.link");
    alert("IP скопирован!");
}
</script>

</body>
</html>
