<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>2o2p</title>

<style>
@font-face {
    font-family: 'Minecraft';
    src: url('Minecraft.ttf');
}

body {
    margin: 0;
    font-family: 'Minecraft';
    background: black;
}

/* ШАПКА */
.header {
    background: #00ff00; /* кислотный */
    text-align: center;
    padding: 10px;
    font-size: 24px;
}

/* фикс цветов */
.logo-blue {
    color: #0040ff;
}

.logo-red {
    color: #ff0000;
}

/* ФОН */
.bg {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.bg img {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 2s;
}

.bg img.active {
    opacity: 1;
}

/* затемнение */
.bg::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.6);
}

/* ПАНЕЛЬ */
.box {
    margin: 100px auto;
    width: 300px;
    background: #00ff00; /* кислотная панель */
    padding: 20px;
    text-align: center;
    color: red;
}

/* IP */
.ip {
    margin-top: 10px;
    padding: 8px;
    background: black;
    color: #00ffcc;
}
</style>
</head>

<body>

<div class="bg">
    <img src="1.png" class="active">
    <img src="2.png">
    <img src="3.png">
    <img src="4.png">
    <img src="5.png">
    <img src="6.png">
    <img src="7.png">
    <img src="8.png">
    <img src="9.png">
    <img src="10.png">
</div>

<div class="header">
    <span class="logo-blue">2O</span><span class="logo-red">2P</span>
</div>

<div class="box">
    <h2>2o2p Server</h2>
    <p>Анархия без правил. Никаких вайпов. Делай что хочешь.</p>
    <p>??? Playing Now</p>

    <div class="ip">role-nine.gl.joinmc.link</div>

    <p style="margin-top:10px;">Нажми чтобы скопировать</p>
</div>

<script>
let slides = document.querySelectorAll(".bg img");
let i = 0;

setInterval(() => {
    slides[i].classList.remove("active");
    i = (i + 1) % slides.length;
    slides[i].classList.add("active");
}, 4000);
</script>

</body>
</html>
